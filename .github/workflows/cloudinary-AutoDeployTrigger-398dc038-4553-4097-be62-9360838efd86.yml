name: Trigger auto deployment for cloudinary

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cloudinary-AutoDeployTrigger-398dc038-4553-4097-be62-9360838efd86.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLOUDINARY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CLOUDINARY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CLOUDINARY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ${{ secrets.CLOUDINARY_REGISTRY_URL }}
          registryUsername: ${{ secrets.CLOUDINARY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CLOUDINARY_REGISTRY_PASSWORD }}
          containerAppName: cloudinary
          resourceGroup: nats
          imageToBuild: ${{ secrets.CLOUDINARY_REGISTRY_URL }}/cloudinary:${{ github.sha }}
